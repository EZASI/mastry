<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>404 — ページが見つかりません · MASTRY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&display=swap">
<style>
  :root{--ink:#0e1b2c;--bone:#f7f5f0;--accent:#2563eb}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(165deg,#f7f9fc 0%,#e8eef6 100%);
    font-family:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;color:var(--ink);text-align:center;padding:24px}
  .mark{font-size:.8rem;letter-spacing:.55em;text-indent:.55em;opacity:.55;margin-bottom:28px}
  h1{font-size:min(3.6rem,8vw);font-weight:600;letter-spacing:.06em;margin-bottom:14px;white-space:nowrap}
  p{font-size:.98rem;line-height:2;opacity:.75;margin-bottom:34px;word-break:keep-all;overflow-wrap:anywhere}
  .en{font-size:.85rem;opacity:1;display:block;margin-top:4px;word-break:normal;overflow-wrap:normal}
  a.btn{display:inline-block;padding:14px 38px;border:1px solid var(--ink);border-radius:999px;
    color:var(--ink);text-decoration:none;font-size:.92rem;letter-spacing:.18em;text-indent:.18em;transition:all .3s}
  a.btn:hover{background:var(--ink);color:var(--bone)}
  .links{margin-top:26px;font-size:.85rem}
  .links a{color:var(--accent);text-decoration:none;margin:0 4px;display:inline-block;padding:12px 6px}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">M A S T R Y</div>
  <h1>静けさの、その先へ。</h1>
  <p>お探しのページは<wbr>見つかりませんでした。<br>移動または<wbr>削除された<wbr>可能性があります。
  <span class="en" lang="en">404 — We couldn't find that page. It may have moved or been&nbsp;removed.</span></p>
  <a class="btn" href="/">ホームへ戻る / Home</a>
  <div class="links">
    <a href="/faq.html">FAQ</a>·<a href="/contact.html">お問い合わせ / Contact</a>
  </div>
</main>
</body>
</html>
